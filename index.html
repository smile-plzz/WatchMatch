<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ReelChat — Precise Movie &amp; TV Recommendations</title>
<meta name="description" content="Chat about what you're in the mood to watch — ReelChat recommends specific, real movie and TV titles, not generic genre buckets." />
<style>
  :root {
    --bg: #0e1116;
    --bg-panel: #161b22;
    --bg-elevated: #1c232d;
    --border: #2a3340;
    --text: #e6edf3;
    --text-dim: #9aa7b5;
    --accent: #6d8cff;
    --accent-dim: #3d4f99;
    --user-bubble: #2a3f6b;
    --assistant-bubble: #1c232d;
    --danger: #e5534b;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 780px;
    margin: 0 auto;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 1.05rem;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header h1 .dot { color: var(--accent); }
  .header-actions { display: flex; gap: 8px; }
  button.icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 0.8rem;
  }
  button.icon-btn:hover { color: var(--text); border-color: var(--accent-dim); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { display: flex; flex-direction: column; max-width: 88%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: var(--radius);
    line-height: 1.45;
    white-space: pre-wrap;
    font-size: 0.95rem;
  }
  .msg.user .bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--assistant-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.system .bubble { background: transparent; border: 1px dashed var(--border); color: var(--text-dim); font-size: 0.85rem; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin-top: 8px;
    width: 100%;
  }
  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card .poster {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    background: #10151c;
    display: block;
  }
  .card .poster.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 0.75rem;
    text-align: center;
    padding: 8px;
  }
  .card .info { padding: 8px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .card .title { font-size: 0.82rem; font-weight: 600; line-height: 1.25; }
  .card .meta { font-size: 0.72rem; color: var(--text-dim); }
  .card .actions { display: flex; gap: 4px; padding: 0 8px 8px; }
  .card .actions button {
    flex: 1;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 4px 0;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .card .actions button.active { color: var(--accent); border-color: var(--accent-dim); }
  .card .actions button:hover { color: var(--text); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .chip:hover { color: var(--text); border-color: var(--accent-dim); }

  .typing { display: flex; gap: 4px; padding: 10px 14px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .retry-btn {
    margin-top: 8px;
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    align-self: flex-start;
  }

  #composer {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #composer input {
    flex: 1;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 0.95rem;
    outline: none;
  }
  #composer input:focus { border-color: var(--accent-dim); }
  #composer button {
    background: var(--accent);
    border: none;
    color: #0b0e13;
    font-weight: 600;
    border-radius: 999px;
    padding: 0 20px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  #composer button:disabled { opacity: 0.5; cursor: not-allowed; }

  dialog#keyDialog {
    background: var(--bg-panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    max-width: 420px;
    width: 90%;
  }
  dialog#keyDialog::backdrop { background: rgba(0,0,0,0.6); }
  dialog#keyDialog h2 { margin-top: 0; font-size: 1rem; }
  dialog#keyDialog p { color: var(--text-dim); font-size: 0.85rem; line-height: 1.4; }
  dialog#keyDialog input {
    width: 100%; padding: 8px 10px; margin: 10px 0;
    background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; font-size: 0.9rem;
  }
  dialog#keyDialog .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
  dialog#keyDialog button { border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 0.85rem; }
  dialog#keyDialog button.primary { background: var(--accent); border: none; color: #0b0e13; font-weight: 600; }
  dialog#keyDialog button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }

  @media (max-width: 480px) {
    header h1 span.subtitle { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span class="dot">●</span> ReelChat <span class="subtitle" style="font-weight:400;color:var(--text-dim);font-size:0.8rem;margin-left:6px;">precise watch recommendations</span></h1>
    <div class="header-actions">
      <button class="icon-btn" id="keyBtn" title="Set your OMDB API key">🔑</button>
      <button class="icon-btn" id="newChatBtn" title="Start a new conversation">New chat</button>
    </div>
  </header>

  <div id="messages"></div>

  <form id="composer" autocomplete="off">
    <input id="input" type="text" placeholder="What are you in the mood to watch?" maxlength="500" />
    <button type="submit" id="sendBtn">Send</button>
  </form>
</div>

<dialog id="keyDialog">
  <h2>OMDB API key</h2>
  <p>ReelChat looks up posters and ratings for recommended titles via the free
     <a href="https://www.omdbapi.com/apikey.aspx" target="_blank" rel="noopener">OMDB API</a>.
     Your key is stored only in this browser (localStorage) — never sent anywhere but OMDB.</p>
  <input id="keyInput" type="text" placeholder="Paste your OMDB API key" />
  <div class="dialog-actions">
    <button type="button" class="secondary" id="keyCancel">Cancel</button>
    <button type="button" class="primary" id="keySave">Save</button>
  </div>
</dialog>

<script>
(function () {
  'use strict';

  const LS = {
    OMDB_KEY: 'reelchat_omdb_key',
    WATCHED: 'reelchat_watched',
    NOT_INTERESTED: 'reelchat_not_interested',
    FAVORITES: 'reelchat_favorites',
  };

  const messagesEl = document.getElementById('messages');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const newChatBtn = document.getElementById('newChatBtn');
  const keyBtn = document.getElementById('keyBtn');
  const keyDialog = document.getElementById('keyDialog');
  const keyInput = document.getElementById('keyInput');

  let history = [];   // [{role, content}]
  let busy = false;

  function loadSet(key) {
    try { return new Set(JSON.parse(localStorage.getItem(key) || '[]')); }
    catch { return new Set(); }
  }
  function saveSet(key, set) {
    try { localStorage.setItem(key, JSON.stringify([...set])); } catch {}
  }
  function omdbKey() {
    try { return localStorage.getItem(LS.OMDB_KEY) || ''; } catch { return ''; }
  }

  let watched = loadSet(LS.WATCHED);
  let notInterested = loadSet(LS.NOT_INTERESTED);
  let favorites = loadSet(LS.FAVORITES);

  function excludeList() {
    return [...watched, ...notInterested].slice(0, 200);
  }

  // ---------- rendering ----------

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addSystemNote(text) {
    const div = document.createElement('div');
    div.className = 'msg system';
    div.innerHTML = `<div class="bubble"></div>`;
    div.querySelector('.bubble').textContent = text;
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function addUserMessage(text) {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `<div class="bubble"></div>`;
    div.querySelector('.bubble').textContent = text;
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function addTypingIndicator() {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.id = 'typingIndicator';
    div.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  function removeTypingIndicator() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function titleKey(rec) {
    return rec.year ? `${rec.title} (${rec.year})` : rec.title;
  }

  async function fetchOmdb(rec) {
    const key = omdbKey();
    if (!key) return null;
    const params = new URLSearchParams({ apikey: key, t: rec.title });
    if (rec.year) params.set('y', rec.year);
    if (rec.type) params.set('type', rec.type);
    try {
      const res = await fetch(`https://www.omdbapi.com/?${params.toString()}`);
      const data = await res.json();
      if (data && data.Response === 'True') return data;
    } catch {}
    return null;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function buildCard(rec, omdbData) {
    const card = document.createElement('div');
    card.className = 'card';
    const key = titleKey(rec);
    const isFav = favorites.has(key);
    const isWatched = watched.has(key);
    const isNotInterested = notInterested.has(key);

    const poster = omdbData && omdbData.Poster && omdbData.Poster !== 'N/A' ? omdbData.Poster : null;
    const displayTitle = omdbData ? omdbData.Title : rec.title;
    const displayYear = omdbData ? omdbData.Year : rec.year;
    const rating = omdbData && omdbData.imdbRating && omdbData.imdbRating !== 'N/A' ? `★ ${omdbData.imdbRating}` : '';

    card.innerHTML = `
      ${poster
        ? `<img class="poster" src="${poster}" alt="${escapeHtml(displayTitle)} poster" loading="lazy" />`
        : `<div class="poster placeholder">${escapeHtml(displayTitle)}</div>`}
      <div class="info">
        <div class="title">${escapeHtml(displayTitle)}</div>
        <div class="meta">${escapeHtml(displayYear || '')}${rating ? ' · ' + rating : ''}${rec.type ? ' · ' + escapeHtml(rec.type) : ''}</div>
      </div>
      <div class="actions">
        <button data-action="fav" class="${isFav ? 'active' : ''}" title="Favorite">♥</button>
        <button data-action="watched" class="${isWatched ? 'active' : ''}" title="Mark watched">✓</button>
        <button data-action="skip" class="${isNotInterested ? 'active' : ''}" title="Not interested">✕</button>
      </div>
    `;

    card.querySelector('[data-action="fav"]').addEventListener('click', () => {
      if (favorites.has(key)) favorites.delete(key); else favorites.add(key);
      saveSet(LS.FAVORITES, favorites);
      card.querySelector('[data-action="fav"]').classList.toggle('active');
    });
    card.querySelector('[data-action="watched"]').addEventListener('click', () => {
      if (watched.has(key)) watched.delete(key); else watched.add(key);
      saveSet(LS.WATCHED, watched);
      card.querySelector('[data-action="watched"]').classList.toggle('active');
    });
    card.querySelector('[data-action="skip"]').addEventListener('click', () => {
      if (notInterested.has(key)) notInterested.delete(key); else notInterested.add(key);
      saveSet(LS.NOT_INTERESTED, notInterested);
      card.querySelector('[data-action="skip"]').classList.toggle('active');
    });

    return card;
  }

  async function addAssistantMessage(reply, recommendations) {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = reply;
    div.appendChild(bubble);

    if (recommendations && recommendations.length) {
      const cardsWrap = document.createElement('div');
      cardsWrap.className = 'cards';
      div.appendChild(cardsWrap);
      messagesEl.appendChild(div);
      scrollToBottom();

      for (const rec of recommendations) {
        const omdbData = await fetchOmdb(rec);
        cardsWrap.appendChild(buildCard(rec, omdbData));
        scrollToBottom();
      }

      if (!omdbKey()) {
        const hint = document.createElement('div');
        hint.className = 'meta';
        hint.style.marginTop = '6px';
        hint.style.color = 'var(--text-dim)';
        hint.style.fontSize = '0.75rem';
        hint.textContent = 'Set an OMDB API key (🔑 above) to see posters and ratings for these picks.';
        div.appendChild(hint);
      }

      const chips = document.createElement('div');
      chips.className = 'chips';
      ['Something different', 'Something shorter', 'Something newer', 'More like the first one'].forEach(label => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.textContent = label;
        chip.addEventListener('click', () => sendMessage(label));
        chips.appendChild(chip);
      });
      div.appendChild(chips);
    } else {
      messagesEl.appendChild(div);
    }
    scrollToBottom();
  }

  function addRetry(onRetry) {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    const btn = document.createElement('button');
    btn.className = 'retry-btn';
    btn.textContent = 'Retry';
    btn.addEventListener('click', () => { div.remove(); onRetry(); });
    div.appendChild(btn);
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  // ---------- chat flow ----------

  async function sendMessage(text) {
    if (busy || !text.trim()) return;
    busy = true;
    sendBtn.disabled = true;

    addUserMessage(text);
    history.push({ role: 'user', content: text });
    addTypingIndicator();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history, exclude: excludeList() }),
      });
      const data = await res.json();
      removeTypingIndicator();

      if (!res.ok) {
        addSystemNote(data.error || 'Something went wrong.');
        addRetry(() => sendMessage(text));
        history.pop();
        return;
      }

      history.push({ role: 'assistant', content: data.reply });
      await addAssistantMessage(data.reply, data.recommendations);
    } catch (err) {
      removeTypingIndicator();
      addSystemNote('Could not reach the server — check your connection.');
      addRetry(() => sendMessage(text));
      history.pop();
    } finally {
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value;
    input.value = '';
    sendMessage(text);
  });

  newChatBtn.addEventListener('click', () => {
    history = [];
    messagesEl.innerHTML = '';
    addSystemNote('New conversation started.');
    addAssistantMessage(
      "Hi, I'm ReelChat. Tell me what you're in the mood for — a genre, a mood, something like a show you already loved, how much time you've got, whatever's on your mind — and I'll find specific titles that actually fit.",
      []
    );
  });

  // ---------- OMDB key dialog ----------

  keyBtn.addEventListener('click', () => {
    keyInput.value = omdbKey();
    keyDialog.showModal();
  });
  document.getElementById('keyCancel').addEventListener('click', () => keyDialog.close());
  document.getElementById('keySave').addEventListener('click', () => {
    try { localStorage.setItem(LS.OMDB_KEY, keyInput.value.trim()); } catch {}
    keyDialog.close();
  });

  // ---------- init ----------

  addAssistantMessage(
    "Hi, I'm ReelChat. Tell me what you're in the mood for — a genre, a mood, something like a show you already loved, how much time you've got, whatever's on your mind — and I'll find specific titles that actually fit.",
    []
  );
  input.focus();
})();
</script>
</body>
</html>
