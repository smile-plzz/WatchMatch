<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>WatchMatch — Tell it what you're in the mood for</title>
<meta name="description" content="Chat about what you're in the mood to watch — WatchMatch recommends specific, real movie and TV titles, and adapts instantly to your feedback." />
<meta name="color-scheme" content="light dark" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0c0f;
    --bg-elevated: #16181d;
    --bg-subtle: #1b1e24;
    --border: rgba(255,255,255,0.09);
    --text: #f2f3f5;
    --text-dim: #979aa3;
    --text-faint: #676b76;
    --accent: #ff7a45;
    --accent-text: #1a0e08;
    --accent-tint: rgba(255,122,69,0.14);
    --accent-tint-strong: rgba(255,122,69,0.28);
    --danger: #ef5f57;
    --danger-tint: rgba(239,95,87,0.14);
    --ok: #4fbf7a;
    --ok-tint: rgba(79,191,122,0.14);
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #faf9f7;
      --bg-elevated: #ffffff;
      --bg-subtle: #f1efec;
      --border: rgba(0,0,0,0.08);
      --text: #17181b;
      --text-dim: #6b6e76;
      --text-faint: #9a9da5;
      --accent: #e8622f;
      --accent-text: #fff8f5;
      --accent-tint: rgba(232,98,47,0.10);
      --accent-tint-strong: rgba(232,98,47,0.20);
      --shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 760px;
    margin: 0 auto;
  }

  /* ---------- header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand svg { display: block; }
  .brand-name { font-size: 0.95rem; font-weight: 650; letter-spacing: -0.01em; }
  .header-actions { display: flex; gap: 6px; }
  button.icon-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    border-radius: 999px;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  button.icon-btn:hover { color: var(--text); background: var(--bg-subtle); }
  button.icon-btn svg { width: 17px; height: 17px; }

  /* ---------- hero / empty state ---------- */
  #hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px 24px 10vh;
    gap: 18px;
    animation: fadeIn 0.4s ease;
  }
  #hero .mark { opacity: 0.9; }
  #hero h2 {
    font-size: 1.5rem;
    font-weight: 650;
    letter-spacing: -0.02em;
    margin: 0;
  }
  #hero p {
    color: var(--text-dim);
    font-size: 0.95rem;
    max-width: 360px;
    margin: 0;
    line-height: 1.5;
  }
  .suggestion-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
    width: 100%;
    max-width: 480px;
  }
  .suggestion-card {
    text-align: left;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-size: 0.83rem;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s, color 0.15s;
  }
  .suggestion-card:hover {
    border-color: var(--accent-tint-strong);
    color: var(--text);
    transform: translateY(-1px);
  }
  .suggestion-card:active { transform: translateY(0) scale(0.98); }

  /* ---------- transcript ---------- */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  #messages.hidden { display: none; }
  .msg { display: flex; flex-direction: column; max-width: 90%; animation: rise 0.28s ease; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: stretch; align-items: flex-start; max-width: 100%; }

  .msg.user .bubble {
    background: var(--accent-tint);
    padding: 9px 15px;
    border-radius: 16px 16px 4px 16px;
    font-size: 0.93rem;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .msg.user.auto .bubble {
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--text-dim);
    font-size: 0.8rem;
    padding: 6px 13px;
  }

  .msg.assistant .bubble {
    font-size: 0.95rem;
    line-height: 1.55;
    white-space: pre-wrap;
    color: var(--text);
    padding: 0 2px;
  }

  .msg.system .bubble {
    color: var(--text-faint);
    font-size: 0.78rem;
    align-self: center;
    padding: 4px 0;
  }
  .msg.system { align-self: center; }

  /* ---------- cards ---------- */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 12px;
    margin-top: 12px;
    width: 100%;
  }
  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    animation: rise 0.35s ease backwards;
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .card:active { transform: translateY(0) scale(0.985); }
  .card .poster-wrap { position: relative; width: 100%; aspect-ratio: 2 / 3; background: var(--bg-subtle); overflow: hidden; }
  .card .poster-wrap:has(img:not(.loaded)) {
    background: linear-gradient(100deg, var(--bg-subtle) 30%, var(--bg-elevated) 45%, var(--bg-subtle) 60%);
    background-size: 250% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
  }
  .card .poster {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .card .poster.loaded { opacity: 1; }
  .card .poster.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-faint);
    font-size: 0.72rem;
    text-align: center;
    padding: 10px;
    height: 100%;
  }
  .card .rating-badge {
    position: absolute;
    top: 7px; left: 7px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(3px);
    color: #fff;
    font-size: 0.68rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
  }
  .card .info { padding: 9px 10px 4px; display: flex; flex-direction: column; gap: 3px; }
  .card .title { font-size: 0.82rem; font-weight: 630; line-height: 1.25; }
  .card .meta { font-size: 0.71rem; color: var(--text-faint); }
  .card .reason {
    font-size: 0.73rem;
    color: var(--text-dim);
    line-height: 1.35;
    padding: 0 10px 8px;
    font-style: italic;
  }
  .card .actions { display: flex; gap: 4px; padding: 0 8px 9px; margin-top: auto; }
  .action-btn {
    flex: 1;
    background: var(--bg-subtle);
    border: 1px solid transparent;
    color: var(--text-dim);
    border-radius: var(--radius-sm);
    padding: 5px 0;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .action-btn:hover { color: var(--text); }
  .action-btn[data-action="like"].active { color: var(--accent); background: var(--accent-tint); border-color: var(--accent-tint-strong); }
  .action-btn[data-action="watched"].active { color: var(--ok); background: var(--ok-tint); }
  .action-btn[data-action="dislike"].active { color: var(--danger); background: var(--danger-tint); }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
  .chip {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .chip:hover { color: var(--text); border-color: var(--accent-tint-strong); }
  .chip:active { transform: scale(0.96); }
  .action-btn:active { transform: scale(0.92); }

  .typing { display: flex; gap: 4px; padding: 4px 2px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes shimmer { 0% { background-position: 150% 0; } 100% { background-position: -50% 0; } }

  .retry-btn {
    margin-top: 2px;
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: var(--radius-sm);
    padding: 5px 13px;
    font-size: 0.8rem;
    cursor: pointer;
    align-self: flex-start;
  }

  /* ---------- composer ---------- */
  #composer-wrap { padding: 10px 16px max(18px, env(safe-area-inset-bottom)); flex-shrink: 0; }
  #composer {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 6px 6px 18px;
    box-shadow: var(--shadow);
    transition: border-color 0.15s;
  }
  #composer:focus-within { border-color: var(--accent-tint-strong); }
  #composer input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 0.94rem;
    outline: none;
    padding: 8px 0;
  }
  #composer input::placeholder { color: var(--text-faint); }
  #composer button.send {
    background: var(--accent);
    border: none;
    color: var(--accent-text);
    width: 38px; height: 38px;
    border-radius: 999px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s, transform 0.1s;
  }
  #composer button.send:active { transform: scale(0.93); }
  #composer button.send:disabled { opacity: 0.4; cursor: not-allowed; }
  #composer button.send svg { width: 16px; height: 16px; }

  /* ---------- movie detail modal ---------- */
  dialog#movieModal {
    position: relative;
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 0;
    max-width: 660px;
    width: 92vw;
    max-height: 86vh;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  dialog#movieModal::backdrop { background: rgba(0,0,0,0.55); backdrop-filter: blur(3px); }
  .modal-scroll { overflow: hidden auto; max-height: 86vh; }
  .modal-close-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(3px);
    border: none;
    color: #fff;
    width: 32px; height: 32px;
    border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 5;
    transition: background 0.15s, transform 0.1s;
  }
  .modal-close-btn:hover { background: rgba(0,0,0,0.75); }
  .modal-close-btn:active { transform: scale(0.92); }
  .modal-body { display: flex; flex-direction: row; gap: 20px; padding: 22px; }
  .modal-poster-wrap {
    flex: 0 0 150px;
    width: 150px;
    aspect-ratio: 2 / 3;
    border-radius: var(--radius-md);
    background: var(--bg-subtle);
    overflow: hidden;
    position: relative;
  }
  .modal-poster-wrap:has(img:not(.loaded)) {
    background: linear-gradient(100deg, var(--bg-subtle) 30%, var(--bg-elevated) 45%, var(--bg-subtle) 60%);
    background-size: 250% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
  }
  .modal-poster-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .modal-poster-wrap img.loaded { opacity: 1; }
  .modal-poster-wrap.placeholder { display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 0.78rem; text-align: center; padding: 8px; }
  .modal-content { flex: 1; min-width: 0; }
  .modal-content h2 { margin: 0 26px 6px 0; font-size: 1.25rem; letter-spacing: -0.01em; line-height: 1.25; }
  .modal-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .modal-tags span {
    font-size: 0.72rem;
    color: var(--text-dim);
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
  }
  .modal-plot { font-size: 0.9rem; line-height: 1.55; color: var(--text-dim); margin: 0 0 14px; }
  .modal-meta-grid { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 0.82rem; margin-bottom: 16px; }
  .modal-meta-grid dt { color: var(--text-faint); }
  .modal-meta-grid dd { margin: 0; color: var(--text); }
  .modal-actions-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .watch-now-btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 650;
    font-size: 0.88rem;
    padding: 10px 18px;
    border-radius: 999px;
    text-decoration: none;
    transition: opacity 0.15s;
  }
  .watch-now-btn:hover { opacity: 0.88; }
  .watch-now-btn svg { width: 14px; height: 14px; }
  .modal-quick-actions { display: flex; gap: 6px; }
  .modal-quick-actions .action-btn { flex: none; width: 38px; padding: 8px 0; font-size: 0.95rem; }
  .modal-loading { padding: 40px 22px; text-align: center; color: var(--text-dim); font-size: 0.9rem; }

  /* ---------- OMDB unconfigured banner ---------- */
  .omdb-hint {
    margin-top: 8px;
    color: var(--text-faint);
    font-size: 0.75rem;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

  @media (max-width: 480px) {
    .suggestion-grid { grid-template-columns: 1fr; }
    #hero h2 { font-size: 1.3rem; }
  }

  @media (max-width: 560px) {
    .modal-body { flex-direction: column; padding: 20px 18px; gap: 14px; }
    .modal-poster-wrap { width: 108px; flex: 0 0 auto; }
    .modal-content h2 { margin-right: 0; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <svg class="mark" width="26" height="26" viewBox="0 0 26 26" fill="none">
        <circle cx="13" cy="13" r="12" stroke="var(--accent)" stroke-width="1.6"/>
        <path d="M10.5 8.5L18 13L10.5 17.5V8.5Z" fill="var(--accent)"/>
      </svg>
      <span class="brand-name">WatchMatch</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="newChatBtn" title="Start a new conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <div id="hero">
    <svg class="mark" width="40" height="40" viewBox="0 0 26 26" fill="none">
      <circle cx="13" cy="13" r="12" stroke="var(--accent)" stroke-width="1.4"/>
      <path d="M10.5 8.5L18 13L10.5 17.5V8.5Z" fill="var(--accent)"/>
    </svg>
    <h2>What do you want to watch tonight?</h2>
    <p>Tell WatchMatch your mood, a movie you loved, or how much time you've got — it'll come back with exact titles, not genre buckets. React to what it suggests and it adjusts immediately.</p>
    <div class="suggestion-grid">
      <button class="suggestion-card" data-prompt="I want something tense and clever, like a heist or a mystery — a movie, not a series.">A clever heist or mystery movie</button>
      <button class="suggestion-card" data-prompt="I've had a long week and just want something warm, funny, and easy to watch — comfort viewing.">Comfort watch after a long week</button>
      <button class="suggestion-card" data-prompt="Something like Inception or Arrival — smart sci-fi that makes me think, but not too confusing.">Smart sci-fi, not too confusing</button>
      <button class="suggestion-card" data-prompt="I want to start a new series I can binge, ideally under 8 episodes a season, dark and atmospheric.">A short, dark series to binge</button>
    </div>
  </div>

  <div id="messages" class="hidden"></div>

  <div id="composer-wrap">
    <form id="composer" autocomplete="off">
      <input id="input" type="text" placeholder="What are you in the mood to watch?" maxlength="500" />
      <button type="submit" class="send" id="sendBtn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </div>
</div>

<dialog id="movieModal" aria-labelledby="modalTitleHeading">
  <button class="modal-close-btn" id="modalCloseBtn" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <div class="modal-scroll">
    <div class="modal-body" id="modalBody">
      <div class="modal-loading">Loading details…</div>
    </div>
  </div>
</dialog>

<script>
(function () {
  'use strict';

  const LS = {
    WATCHED: 'watchmatch_watched',
    NOT_INTERESTED: 'watchmatch_not_interested',
    LIKED: 'watchmatch_liked',
  };

  const STREAM_BASE = 'https://smile-plzz.github.io/streamv2/';

  const heroEl = document.getElementById('hero');
  const messagesEl = document.getElementById('messages');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const newChatBtn = document.getElementById('newChatBtn');
  const movieModal = document.getElementById('movieModal');
  const modalBody = document.getElementById('modalBody');
  const modalCloseBtn = document.getElementById('modalCloseBtn');

  let history = [];   // [{role, content}]
  let busy = false;
  let lastFocused = null;
  let sessionShown = new Set(); // titles already recommended this conversation (resets on New Chat)

  function loadSet(key) {
    try { return new Set(JSON.parse(localStorage.getItem(key) || '[]')); }
    catch { return new Set(); }
  }
  function saveSet(key, set) {
    try { localStorage.setItem(key, JSON.stringify([...set])); } catch {}
  }

  let watched = loadSet(LS.WATCHED);
  let notInterested = loadSet(LS.NOT_INTERESTED);
  let liked = loadSet(LS.LIKED);

  function excludeList() {
    return [...watched, ...notInterested].slice(0, 200);
  }
  function likedList() {
    return [...liked].slice(0, 200);
  }
  function shownList() {
    return [...sessionShown].slice(0, 200);
  }

  // ---------- rendering ----------

  function showTranscript() {
    heroEl.classList.add('gone');
    heroEl.style.display = 'none';
    messagesEl.classList.remove('hidden');
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addSystemNote(text) {
    const div = document.createElement('div');
    div.className = 'msg system';
    div.innerHTML = `<div class="bubble"></div>`;
    div.querySelector('.bubble').textContent = text;
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function addUserMessage(text, auto) {
    const div = document.createElement('div');
    div.className = 'msg user' + (auto ? ' auto' : '');
    div.innerHTML = `<div class="bubble"></div>`;
    div.querySelector('.bubble').textContent = text;
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function addTypingIndicator() {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.id = 'typingIndicator';
    div.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  function removeTypingIndicator() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function titleKey(rec) {
    return rec.year ? `${rec.title} (${rec.year})` : rec.title;
  }

  async function fetchOmdbRaw(params) {
    try {
      const qs = new URLSearchParams(params);
      const res = await fetch(`/api/omdb?${qs.toString()}`);
      return await res.json();
    } catch {
      return null;
    }
  }

  async function fetchOmdb(params) {
    const data = await fetchOmdbRaw(params);
    return (data && data.Response === 'True' && !data.Search) ? data : null;
  }

  // Best-effort resolution for an AI-recommended title: exact title+year match,
  // then title alone (the model's stated year is occasionally off by one), then
  // a fuzzy OMDB search as a last resort — so a near-miss still resolves to a
  // real poster/card instead of a bare, unverifiable placeholder.
  async function resolveOmdb(rec, extra) {
    extra = extra || {};
    const type = rec.type || '';

    let data = await fetchOmdb({ t: rec.title, y: rec.year || '', type, ...extra });
    if (data) return data;

    if (rec.year) {
      data = await fetchOmdb({ t: rec.title, type, ...extra });
      if (data) return data;
    }

    const searchData = await fetchOmdbRaw({ s: rec.title, type });
    const candidates = (searchData && searchData.Response === 'True' && Array.isArray(searchData.Search))
      ? searchData.Search
      : [];
    if (!candidates.length) return null;

    const best = (rec.year && candidates.find(c => c.Year && c.Year.startsWith(String(rec.year)))) || candidates[0];
    return fetchOmdb({ i: best.imdbID, ...extra });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function cssKey(key) {
    return (window.CSS && CSS.escape) ? CSS.escape(key) : key.replace(/["\\]/g, '\\$&');
  }

  function applyStateToContainer(container, key) {
    container.querySelectorAll('[data-action]').forEach(btn => {
      const action = btn.dataset.action;
      const active = (action === 'like' && liked.has(key))
        || (action === 'watched' && watched.has(key))
        || (action === 'dislike' && notInterested.has(key));
      btn.classList.toggle('active', active);
    });
  }

  // Refresh like/watched/dislike button states everywhere this title appears
  // (multiple cards across turns, plus the modal if it's open on this title).
  // Relies on the container already being attached to the document — use
  // applyStateToContainer directly for a freshly-built, not-yet-attached node.
  function syncActionState(key) {
    document.querySelectorAll(`[data-key="${cssKey(key)}"]`).forEach(container => {
      applyStateToContainer(container, key);
    });
  }

  function buildActionsHtml(key) {
    const isLiked = liked.has(key);
    const isWatched = watched.has(key);
    const isDisliked = notInterested.has(key);
    return `
      <button type="button" class="action-btn" data-action="like" title="I like this ${isLiked ? '(active)' : ''}">👍</button>
      <button type="button" class="action-btn" data-action="watched" title="Already watched ${isWatched ? '(active)' : ''}">✓</button>
      <button type="button" class="action-btn" data-action="dislike" title="Not for me ${isDisliked ? '(active)' : ''}">👎</button>
    `.trim();
  }

  function wireActions(container, key, displayTitle, displayYear) {
    applyStateToContainer(container, key);
    container.querySelector('[data-action="like"]').addEventListener('click', (e) => {
      e.stopPropagation();
      liked.add(key);
      notInterested.delete(key);
      saveSet(LS.LIKED, liked);
      saveSet(LS.NOT_INTERESTED, notInterested);
      syncActionState(key);
    });
    container.querySelector('[data-action="watched"]').addEventListener('click', (e) => {
      e.stopPropagation();
      if (watched.has(key)) watched.delete(key); else watched.add(key);
      saveSet(LS.WATCHED, watched);
      syncActionState(key);
    });
    container.querySelector('[data-action="dislike"]').addEventListener('click', (e) => {
      e.stopPropagation();
      notInterested.add(key);
      liked.delete(key);
      saveSet(LS.NOT_INTERESTED, notInterested);
      saveSet(LS.LIKED, liked);
      syncActionState(key);
      if (movieModal.open) movieModal.close();
      if (!busy) {
        sendMessage(`Not interested in "${displayTitle}"${displayYear ? ` (${displayYear})` : ''} — please try something else instead.`, { auto: true });
      }
    });
  }

  function watchNowUrl(displayTitle, type) {
    const params = new URLSearchParams({ q: displayTitle });
    if (type === 'movie' || type === 'series') params.set('type', type);
    return `${STREAM_BASE}#/search?${params.toString()}`;
  }

  function buildCard(rec, omdbData) {
    const card = document.createElement('div');
    card.className = 'card';
    const key = titleKey(rec);
    card.dataset.key = key;

    const poster = omdbData && omdbData.Poster && omdbData.Poster !== 'N/A' ? omdbData.Poster : null;
    const displayTitle = omdbData ? omdbData.Title : rec.title;
    const displayYear = omdbData ? omdbData.Year : rec.year;
    const rating = omdbData && omdbData.imdbRating && omdbData.imdbRating !== 'N/A' ? `★ ${omdbData.imdbRating}` : '';

    card.innerHTML = `
      <div class="poster-wrap">
        ${poster
          ? `<img class="poster" src="${poster}" alt="${escapeHtml(displayTitle)} poster" loading="lazy" onload="this.classList.add('loaded')" />`
          : `<div class="poster placeholder">${escapeHtml(displayTitle)}</div>`}
        ${rating ? `<span class="rating-badge">${rating}</span>` : ''}
      </div>
      <div class="info">
        <div class="title">${escapeHtml(displayTitle)}</div>
        <div class="meta">${escapeHtml(displayYear || '')}${rec.type ? ' · ' + escapeHtml(rec.type) : ''}${omdbData ? '' : ' · unverified title'}</div>
      </div>
      ${rec.reason ? `<div class="reason">${escapeHtml(rec.reason)}</div>` : ''}
      <div class="actions">${buildActionsHtml(key)}</div>
    `;

    wireActions(card.querySelector('.actions'), key, displayTitle, displayYear);

    card.addEventListener('click', (e) => {
      if (e.target.closest('.actions')) return;
      openMovieModal(rec, omdbData);
    });

    return card;
  }

  // ---------- movie detail modal ----------

  async function openMovieModal(rec, omdbDataInitial) {
    const key = titleKey(rec);
    movieModal.dataset.key = key;
    modalBody.innerHTML = '<div class="modal-loading">Loading details…</div>';
    lastFocused = document.activeElement;
    movieModal.showModal();
    modalCloseBtn.focus();

    const full = omdbDataInitial && omdbDataInitial.imdbID
      ? (await fetchOmdb({ i: omdbDataInitial.imdbID, plot: 'full' })) || omdbDataInitial
      : (await resolveOmdb(rec, { plot: 'full' })) || omdbDataInitial;

    if (!full) {
      modalBody.innerHTML = `
        <div class="modal-content">
          <h2 id="modalTitleHeading">${escapeHtml(rec.title)}</h2>
          <p class="modal-plot">Couldn't load details for this title right now.</p>
          <div class="modal-actions-row">
            <a class="watch-now-btn" href="${watchNowUrl(rec.title, rec.type)}" target="_blank" rel="noopener">▶ Watch Now</a>
          </div>
        </div>
      `;
      return;
    }

    const poster = full.Poster && full.Poster !== 'N/A' ? full.Poster : null;
    const tags = [full.Year, full.Rated, full.Runtime, full.Genre].filter(v => v && v !== 'N/A');
    const ratingsRow = (full.Ratings || []).map(r => `${r.Source}: ${r.Value}`);
    if (full.imdbRating && full.imdbRating !== 'N/A' && !ratingsRow.some(r => r.startsWith('Internet Movie Database'))) {
      ratingsRow.unshift(`IMDb: ${full.imdbRating}/10`);
    }

    const metaRows = [
      ['Director', full.Director],
      ['Cast', full.Actors],
      ['Ratings', ratingsRow.join(' · ')],
      ['Awards', full.Awards],
      ['Box office', full.BoxOffice],
    ].filter(([, v]) => v && v !== 'N/A');

    modalBody.innerHTML = `
      <div class="modal-poster-wrap ${poster ? '' : 'placeholder'}">
        ${poster ? `<img src="${poster}" alt="${escapeHtml(full.Title)} poster" onload="this.classList.add('loaded')" />` : escapeHtml(full.Title)}
      </div>
      <div class="modal-content">
        <h2 id="modalTitleHeading">${escapeHtml(full.Title)}</h2>
        <div class="modal-tags">${tags.map(t => `<span>${escapeHtml(t)}</span>`).join('')}</div>
        <p class="modal-plot">${escapeHtml(full.Plot && full.Plot !== 'N/A' ? full.Plot : 'No synopsis available.')}</p>
        <dl class="modal-meta-grid">
          ${metaRows.map(([k, v]) => `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd>`).join('')}
        </dl>
        <div class="modal-actions-row">
          <a class="watch-now-btn" href="${watchNowUrl(full.Title, rec.type || (full.Type === 'series' ? 'series' : 'movie'))}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            Watch Now
          </a>
          <div class="modal-quick-actions">${buildActionsHtml(key)}</div>
        </div>
      </div>
    `;

    const modalActions = modalBody.querySelector('.modal-quick-actions');
    modalActions.dataset.key = key;
    wireActions(modalActions, key, full.Title, full.Year);
  }

  modalCloseBtn.addEventListener('click', () => movieModal.close());
  movieModal.addEventListener('click', (e) => {
    if (e.target === movieModal) movieModal.close();
  });
  movieModal.addEventListener('close', () => {
    if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
  });

  async function addAssistantMessage(reply, recommendations) {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = reply;
    div.appendChild(bubble);
    messagesEl.appendChild(div);
    scrollToBottom();

    if (recommendations && recommendations.length) {
      const loadingNote = document.createElement('div');
      loadingNote.className = 'omdb-hint';
      loadingNote.textContent = 'Looking up posters and ratings…';
      div.appendChild(loadingNote);
      scrollToBottom();

      // Resolve all titles in parallel (rather than one network round-trip at a
      // time) — noticeably faster for a 6-title batch, with a resolveOmdb()
      // fallback chain per title so a slightly-off year or spelling still
      // finds a real match instead of coming back empty.
      const omdbResults = await Promise.all(recommendations.map(rec => resolveOmdb(rec)));
      loadingNote.remove();

      const cardsWrap = document.createElement('div');
      cardsWrap.className = 'cards';
      div.appendChild(cardsWrap);

      let anyOmdb = false;
      recommendations.forEach((rec, i) => {
        const omdbData = omdbResults[i];
        if (omdbData) anyOmdb = true;
        sessionShown.add(titleKey(rec));
        const card = buildCard(rec, omdbData);
        card.style.animationDelay = `${i * 55}ms`;
        cardsWrap.appendChild(card);
      });
      scrollToBottom();

      if (!anyOmdb) {
        const hint = document.createElement('div');
        hint.className = 'omdb-hint';
        hint.textContent = 'Movie posters and details are unavailable right now — you can still click a title to search it on the streaming site.';
        div.appendChild(hint);
      }

      const chips = document.createElement('div');
      chips.className = 'chips';
      ['Something different', 'Something shorter', 'Something newer', 'More like the first one'].forEach(label => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.textContent = label;
        chip.addEventListener('click', () => sendMessage(label));
        chips.appendChild(chip);
      });
      div.appendChild(chips);
    }
    scrollToBottom();
  }

  function addRetry(onRetry) {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    const btn = document.createElement('button');
    btn.className = 'retry-btn';
    btn.textContent = 'Retry';
    btn.addEventListener('click', () => { div.remove(); onRetry(); });
    div.appendChild(btn);
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  // ---------- chat flow ----------

  async function sendMessage(text, opts) {
    opts = opts || {};
    if (busy || !text.trim()) return;
    busy = true;
    sendBtn.disabled = true;
    showTranscript();

    addUserMessage(text, !!opts.auto);
    history.push({ role: 'user', content: text });
    addTypingIndicator();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history, exclude: excludeList(), liked: likedList(), shown: shownList() }),
      });
      const data = await res.json();
      removeTypingIndicator();

      if (!res.ok) {
        addSystemNote(data.error || 'Something went wrong.');
        addRetry(() => sendMessage(text, opts));
        history.pop();
        return;
      }

      history.push({ role: 'assistant', content: data.reply });
      await addAssistantMessage(data.reply, data.recommendations);
    } catch (err) {
      removeTypingIndicator();
      addSystemNote('Could not reach the server — check your connection.');
      addRetry(() => sendMessage(text, opts));
      history.pop();
    } finally {
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value;
    input.value = '';
    sendMessage(text);
  });

  document.querySelectorAll('.suggestion-card').forEach(card => {
    card.addEventListener('click', () => sendMessage(card.dataset.prompt));
  });

  newChatBtn.addEventListener('click', () => {
    history = [];
    sessionShown = new Set();
    messagesEl.innerHTML = '';
    messagesEl.classList.add('hidden');
    heroEl.classList.remove('gone');
    heroEl.style.display = '';
    input.value = '';
  });

  input.focus();
})();
</script>
</body>
</html>
